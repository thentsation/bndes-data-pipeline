[tool.semantic_release]
tag_format = 'v{version}'
commit_message = 'chore(release): v{version} [skip ci]'

[tool.semantic_release.branches.main]
match = 'main'

[tool.ruff]
target-version = "py312"
extend-exclude = ["*.md", "notebooks"]

[tool.ruff.lint]
# N999: the repo's own directory name (bndes-data-pipeline) is hyphenated,
# which isn't a valid Python identifier - irrelevant since nothing imports
# the checkout root by that name.
# BLE001: the Lambda handler's outer try/except must never let an exception
# escape - it always returns a structured {"statusCode": 500, ...} response.
ignore = ["N999", "BLE001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "."
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.':"]
