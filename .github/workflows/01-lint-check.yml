name: 01 - Code Quality & Lint

on:
  push:
    paths-ignore:
      - '**.md'
      - 'notebooks/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'notebooks/**'
  schedule:
    - cron: "0 11 * * *" # 08:00 BRT (UTC-3)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.3

      - name: Run Check
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==2.3.1 types-requests==2.32.4.20250913 boto3-stubs[s3]==1.42.6

      - name: Run type check
        run: mypy

  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.7.3

      - name: Audit dependencies
        run: pip-audit -r requirements.lock
