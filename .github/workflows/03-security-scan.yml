name: 03 - Security Scan

on:
  push:
    paths-ignore:
      - '**.md'
      - 'notebooks/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'notebooks/**'
  schedule:
    - cron: "0 11 * * *" # 08:00 BRT (UTC-3)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image for scanning
        run: docker build -t bndes-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'bndes-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          skip-dirs: var/lang/lib/python3.11/site-packages/pip/_vendor
