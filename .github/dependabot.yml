version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - python

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
    ignore:
      # public.ecr.aws/lambda/python:3.11 -> :3.14 auto-merged as a "minor"
      # bump (Dependabot treats bare version tags loosely) and broke the
      # build - pandas/numpy/pyarrow had no wheels yet for the new runtime.
      # Bumping the Lambda's Python version needs a deliberate, tested PR.
      - dependency-name: "public.ecr.aws/lambda/python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - terraform

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
